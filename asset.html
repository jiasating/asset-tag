<!DOCTYPE html>
<html>
<head>
    <title>Asset Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        img {
            max-width: 100%;
        }
    </style>
</head>
<body>

<div id="assetData">
    Loading...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const assetId = params.get("id");

fetch("assets.csv")
.then(response => response.text())
.then(data => {

    const rows = data.trim().split("\n").map(row => row.split(","));

    const headers = rows[0];

    const asset = rows.find(row => row[0] === assetId);

    if (!asset) {
        document.getElementById("assetData").innerHTML =
            "<h2>Asset Not Found</h2>";
        return;
    }

    let html = `
        <h1>Asset ${asset[0]}</h1>

        <div class="card">
            <h2>${asset[1]}</h2>

            <img src="${asset[7]}" width="300">

            <p><strong>Manufacturer:</strong> ${asset[2]}</p>
            <p><strong>Location:</strong> ${asset[3]}</p>
            <p><strong>Assigned To:</strong> ${asset[4]}</p>
            <p><strong>Purchase Date:</strong> ${asset[5]}</p>
            <p><strong>Status:</strong> ${asset[6]}</p>
            <p><strong>Last Inspection:</strong> ${asset[8]}</p>
            <p><strong>Notes:</strong> ${asset[9]}</p>
        </div>
    `;

    document.getElementById("assetData").innerHTML = html;

});

</script>

</body>
</html>
