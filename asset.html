<!DOCTYPE html>
<html>
<head>
    <title>Asset Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        img {
            max-width: 100%;
            border-radius: 5px;
        }

        .repair-button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
        }

        .repair-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div id="assetData">
    Loading...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const assetId = params.get("id");

fetch("assets.csv")
.then(response => response.text())
.then(data => {

    const rows = data.trim().split("\n").map(row => row.split(","));

    const asset = rows.find(row => row[0] === assetId);

    if (!asset) {
        document.getElementById("assetData").innerHTML =
            "<h2>Asset Not Found</h2>";
        return;
    }

    let html = `
        <h1>Asset ${asset[0]}</h1>

        <div class="card">

            <h2>${asset[1]}</h2>

            <img src="${asset[7]}" alt="${asset[1]}" width="400">

            <p><strong>CAPEX Asset ID:</strong> ${asset[0]}</p>
            <p><strong>Manufacturer:</strong> ${asset[2]}</p>
            <p><strong>Location:</strong> ${asset[3]}</p>
            <p><strong>Assigned To:</strong> ${asset[4]}</p>
            <p><strong>Purchase Date:</strong> ${asset[5]}</p>
            <p><strong>Status:</strong> ${asset[6]}</p>
            <p><strong>Last Inspection:</strong> ${asset[8]}</p>
            <p><strong>Notes:</strong> ${asset[9]}</p>

            <a href="https://forms.office.com/r/wQM2EHkQBg?origin=lprLink"
               target="_blank">
                <button class="repair-button">
                    Submit Repair Request
                </button>
            </a>

        </div>
    `;

    document.getElementById("assetData").innerHTML = html;

});

</script>

</body>
</html>
